# Remplacer plateforme.exemple.org par le nom réel du serveur et placer le
# certificat (fullchain.pem) et la clé (privkey.pem) dans deploiement/certificats/.
server {
    listen 80;
    server_name plateforme.exemple.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name plateforme.exemple.org;

    ssl_certificate     /etc/nginx/certificats/fullchain.pem;
    ssl_certificate_key /etc/nginx/certificats/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 25m;
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    server_tokens off;

    location /static/ {
        alias /srv/statiques/;
        expires 7d;
    }

    # Fichiers servis uniquement après contrôle des droits par l'application
    # (en-tête X-Accel-Redirect) : jamais d'accès direct.
    location /fichiers-proteges/ {
        internal;
        alias /srv/fichiers/;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
