[project]
name = "plateforme"
version = "0.1.0"
description = "Plateforme intégrée de gestion administrative, logistique et documentaire"
requires-python = ">=3.10"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q --reuse-db"
filterwarnings = ["ignore::DeprecationWarning:qrcode.*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "DJ"]
