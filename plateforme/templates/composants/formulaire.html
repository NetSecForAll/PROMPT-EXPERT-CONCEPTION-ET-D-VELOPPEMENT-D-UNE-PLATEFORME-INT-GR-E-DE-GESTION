{% extends "base.html" %}
{% block contenu %}
<h1 class="h4 mb-3">{{ titre }}</h1>
<form method="post" novalidate class="formulaire" {% if confirmation %}data-confirmation="{{ confirmation }}"{% endif %}>
  {% csrf_token %}
  {% if version_formulaire %}<input type="hidden" name="version_formulaire" value="{{ version_formulaire }}">{% endif %}
  {% include "composants/champs.html" %}
  <div class="d-flex flex-wrap gap-2 mt-3">
    <button class="btn btn-primary">Enregistrer</button>
    {% if url_retour %}<a class="btn btn-outline-secondary" href="{{ url_retour }}">Annuler</a>{% endif %}
    {% for libelle, url in actions_secondaires %}<a class="btn btn-outline-warning ms-auto" href="{{ url }}">{{ libelle }}</a>{% endfor %}
  </div>
</form>
{% endblock %}
